map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3001;
    server_name _;

    # Grafana proxy with subpath rewriting for SPA compatibility
    location /grafana-proxy/ {
        # Strip the /grafana-proxy prefix when proxying to Grafana
        proxy_pass http://192.168.49.15:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        # WebSocket support for Grafana live
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Rewrite the frontend settings JSON to set appSubUrl
        sub_filter_once off;
        sub_filter_types application/json text/css application/javascript;
        
        # Fix appSubUrl in the boot settings
        sub_filter '"appSubUrl":""' '"appSubUrl":"/grafana-proxy/"';
        sub_filter '"appSubUrl": ""' '"appSubUrl": "/grafana-proxy/"';
        
        # Fix base href in HTML
        sub_filter '<base href="/"' '<base href="/grafana-proxy/"';
        sub_filter "<base href='/'" "<base href='/grafana-proxy/'";
        
        # Fix asset URLs that start with /public/
        sub_filter 'src="/public/' 'src="/grafana-proxy/public/';
        sub_filter 'href="/public/' 'href="/grafana-proxy/public/';
        sub_filter "src='/public/" "src='/grafana-proxy/public/";
        sub_filter "href='/public/" "href='/grafana-proxy/public/";
        
        # Fix API URLs in JS
        sub_filter 'url:"/api/' 'url:"/grafana-proxy/api/';
        sub_filter "url:'/api/" "url:'/grafana-proxy/api/";
        
        # Fix absolute URLs in CSS
        sub_filter 'url(/public/' 'url(/grafana-proxy/public/';
        sub_filter "url('/public/" "url('/grafana-proxy/public/";
        sub_filter 'url("/public/' 'url("/grafana-proxy/public/';
    }

    # Handle SPA asset/API requests that use absolute paths (bypass base href)
    # These come from the iframe with a /grafana-proxy/ referer
    location /api/ {
        if ($http_referer ~* "^https?://[^/]+/grafana-proxy/") {
            rewrite ^/api/(.*)$ /grafana-proxy/api/$1 last;
        }
        proxy_pass http://192.168.49.15:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location /public/ {
        if ($http_referer ~* "^https?://[^/]+/grafana-proxy/") {
            rewrite ^/public/(.*)$ /grafana-proxy/public/$1 last;
        }
        proxy_pass http://192.168.49.15:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
